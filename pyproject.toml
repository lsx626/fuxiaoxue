[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "elearning-sync/.packaging-*",
    "elearning-sync/build",
    "elearning-sync/dist",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"elearning-sync/gui.py" = ["E402"]
"elearning-sync/tests/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
